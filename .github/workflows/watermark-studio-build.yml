name: Build WatermarkStudio RTX5070 Windows EXE
on:
  push:
    branches:
      - build/watermark-studio-rtx5070
    paths:
      - watermark-studio/TRIGGER_BUILD
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Compile standalone Windows app, verify embedded models and smoke-test
        shell: pwsh
        run: ./watermark-studio/build.ps1
      - name: Publish Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkStudio-RTX5070-Windows-EXE
          path: watermark-studio/upstream/dist/WatermarkStudio.exe
          if-no-files-found: error
          compression-level: 0
